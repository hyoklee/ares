# clio_run compose config for a MULTI-NODE clio-core cluster on ares.
#
# Same pools, ids and chain as nc4_clio_runtime_ram.yaml (the single-node DRAM
# config) so a cluster run stays comparable with the single-node numbers in
# 20260813_claude_netcdf_test_results.md. Two differences, both required for a
# cluster:
#
#   networking.hostfile   nc4_clio_run4.sbatch appends this line at submit time
#                         with the job's node list. An empty/absent hostfile is
#                         what puts the runtime in single-node mode, so without
#                         it four daemons would simply be four unrelated
#                         runtimes rather than one cluster.
#   targets.neighborhood  "Number of targets (nodes CTE can buffer to)"
#                         (core_config.h). 1 pins every buffer to the local
#                         node -- i.e. the extra nodes would hold nothing.
#                         Set to the node count so CTE may place data on all of
#                         them; that is the whole point of the experiment.
#
# The RAM tier stays per node, so a 4-node cluster has 4x the tier capacity of
# the single-node config.
networking:
  port: 9413
  neighborhood_size: 32
memory:
  main_segment_size: 2GB
  client_data_segment_size: 2GB
  runtime_data_segment_size: 2GB
runtime:
  num_threads: 4
  queue_depth: 1024
  local_sched: "default"
compose:
  - mod_name: clio_bdev
    pool_name: "ram::chi_default_bdev"
    pool_query: local
    pool_id: "301.0"
    bdev_type: ram
    capacity: "4GB"
  - mod_name: clio_cte_core
    pool_name: clio_cte_core
    pool_query: local
    pool_id: "512.0"
    storage:
      - path: "ram::cte_ram_tier1"
        bdev_type: "ram"
        capacity_limit: "8GB"
        score: 1.0
    dpe:
      dpe_type: "max_bw"
    targets:
      neighborhood: 4
      default_target_timeout_ms: 30000
      poll_period_ms: 5000
  - mod_name: clio_cte_filesystem
    pool_name: clio_cte_filesystem
    pool_query: local
    pool_id: "560.0"
    next_pool_id: "512.0"
    targets:
      neighborhood: 4
